services:
  xray-balancer-mw:
    build: .
    container_name: xray-balancer-mw
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    env_file:
      - .env
    environment:
      - CONFIG_RUNTIME_PATH=/app/runtime/config.runtime.json
    volumes:
      - ./config.json:/app/config.json:ro
      - xray-balancer-runtime:/app/runtime
    networks:
      - remnawave-network

networks:
  remnawave-network:
    external: true
    name: remnawave-network

volumes:
  xray-balancer-runtime:
